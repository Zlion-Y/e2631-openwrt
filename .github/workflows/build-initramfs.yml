name: build-e2631-initramfs

# Fork of ghahramani/openwrt branch pr-zte-zxhn-h3600 + the files in this
# repo, producing a RAM-only image for the ZTE ZXHN E2631. Change the two
# OPENWRT_* variables to build against your own branch.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch: {}

env:
  OPENWRT_REPO: https://github.com/ghahramani/openwrt
  OPENWRT_REF: pr-zte-zxhn-h3600
  # The RFC branch is only needed for the fast device-tree check.
  LINUX_REPO: https://github.com/ghahramani/linux
  LINUX_REF: h3600-linux-rfc

jobs:
  # Runs in about ten seconds and catches every device-tree mistake that would
  # otherwise surface an hour into the image build.
  dts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # check-dts.sh runs cpp and then dtc. dtc comes from the package below;
      # cpp comes from the gcc already present on the runner image. If that
      # ever stops being true, add gcc here rather than debugging a blank
      # "cpp: command not found".
      - name: Install device tree tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: Fetch the SoC device tree it includes
        run: git clone --depth 1 -b "$LINUX_REF" "$LINUX_REPO" linux

      - name: Compile the board device tree
        run: |
          chmod +x check-dts.sh
          ./check-dts.sh "$PWD/linux"

  build:
    needs: dts
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # The release step at the bottom needs a token it can write with. New
    # repositories default GITHUB_TOKEN to read-only, which would turn that
    # step into a 403 on the first tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Host packages, trimmed to what a single ARM target needs. `make prereq`
      # below is the authority: it fails loudly and by name if anything is
      # missing, so this list only has to be good enough to reach it.
      #
      # python3-distutils is deliberately not here. It does not exist in Ubuntu
      # 24.04 -- distutils went away with Python 3.12, and both
      # packages.ubuntu.com/noble/python3-distutils and the Launchpad binary
      # index for noble/amd64 come up empty. Naming a package apt cannot find
      # fails this step in seconds with "Unable to locate package".
      # python3-setuptools is here instead, and it provides the distutils shim
      # for anything that still imports it.
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ca-certificates device-tree-compiler \
            libelf-dev ccache

      - name: Clone the sanechips branch
        run: git clone --depth 1 -b "$OPENWRT_REF" "$OPENWRT_REPO" openwrt

      - name: Apply the E2631 port
        run: |
          chmod +x apply.sh
          ./apply.sh "$PWD/openwrt"

      - name: Seed the configuration
        run: |
          cp seed/e2631.config openwrt/.config
          cd openwrt
          make defconfig
          echo "--- selected symbols ---"
          grep -E "TARGET_sanechips|ROOTFS_INITRAMFS|MULTI_PROFILE|ALL_PROFILES" .config

      # Fails here rather than forty minutes later inside a package build.
      - name: Host prerequisite check
        run: cd openwrt && make -j1 prereq

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      # Feeds add config symbols, so the .config defconfig'd above is stale by
      # the time the build starts. Re-running defconfig keeps the choices made
      # here and defaults the newly arrived symbols.
      - name: Refresh the configuration
        run: cd openwrt && make defconfig

      # No IGNORE_ERRORS, deliberately. It is the usual way to squeeze an image
      # out of a tree with a few broken packages, but at stage 1 the first
      # failure is the deliverable. The only additions to this branch are one
      # device tree, one device block and one kernel config fragment, so a
      # failure is almost certainly in one of them; ignoring errors would turn
      # that into a missing artefact an hour later, which says nothing about
      # what went wrong.
      - name: Build
        run: cd openwrt && make -j$(nproc) download && make -j$(nproc)

      # The file name follows from DEVICE_VENDOR + DEVICE_MODEL, lowercased with
      # spaces turned into hyphens: ZTE + "ZXHN E2631" -> zte_zxhn-e2631. The
      # same rule yields zte_zxhn-h3600 for the H3600 and
      # xiaomi_redmi-router-ac2100 for the AC2100, which is where that
      # underscore-then-hyphen shape comes from.
      - name: Verify only a RAM image was produced
        run: |
          cd openwrt/bin/targets/sanechips/generic
          ls -la
          if ls *sysupgrade* >/dev/null 2>&1; then
            echo "error: a flashable sysupgrade image appeared; this stage must not produce one" >&2
            exit 1
          fi
          test -f openwrt-sanechips-generic-zte_zxhn-e2631-initramfs.uImage
          sha256sum openwrt-sanechips-generic-zte_zxhn-e2631-initramfs.uImage

      - name: Collect
        run: |
          mkdir -p out
          cp openwrt/bin/targets/sanechips/generic/*e2631*.uImage out/
          # ls through xargs rather than feeding the globs to sha256sum: if the
          # target stops emitting a .manifest, a bare sha256sum *.manifest dies
          # here and takes an otherwise good 150-minute build with it.
          (cd openwrt/bin/targets/sanechips/generic && ls -1 *.uImage *.manifest 2>/dev/null | xargs -r sha256sum) > out/sha256sums.txt
          cp openwrt/.config out/build.config
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: e2631-initramfs
          path: out
          if-no-files-found: error

      - name: Publish on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

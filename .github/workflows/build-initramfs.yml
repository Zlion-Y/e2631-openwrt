name: build-e2631-initramfs

# Fork of ghahramani/openwrt branch pr-zte-zxhn-h3600 + the files in this
# repo, producing a RAM-only image for the ZTE ZXHN E2631. Change the two
# OPENWRT_* variables to build against your own branch.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch: {}

env:
  OPENWRT_REPO: https://github.com/ghahramani/openwrt
  OPENWRT_REF: pr-zte-zxhn-h3600
  # The RFC branch is only needed for the fast device-tree check.
  LINUX_REPO: https://github.com/ghahramani/linux
  LINUX_REF: h3600-linux-rfc

jobs:
  # Runs in about ten seconds and catches every device-tree mistake that would
  # otherwise surface an hour into the image build.
  dts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install device tree tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: Fetch the SoC device tree it includes
        run: git clone --depth 1 -b "$LINUX_REF" "$LINUX_REPO" linux

      - name: Compile the board device tree
        run: |
          chmod +x check-dts.sh
          ./check-dts.sh "$PWD/linux"

  build:
    needs: dts
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The set the OpenWrt build system documents for Debian and Ubuntu,
      # trimmed to what a single ARM target needs. `make prereq` below fails
      # loudly and by name if anything is still missing.
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ca-certificates device-tree-compiler \
            libelf-dev acl2 ccache

      - name: Clone the sanechips branch
        run: git clone --depth 1 -b "$OPENWRT_REF" "$OPENWRT_REPO" openwrt

      - name: Apply the E2631 port
        run: |
          chmod +x apply.sh
          ./apply.sh "$PWD/openwrt"

      - name: Seed the configuration
        run: |
          cp seed/e2631.config openwrt/.config
          cd openwrt
          make defconfig
          echo "--- selected symbols ---"
          grep -E "TARGET_sanechips|ROOTFS_INITRAMFS|MULTI_PROFILE|ALL_PROFILES" .config

      # Fails here rather than forty minutes later inside a package build.
      - name: Host prerequisite check
        run: cd openwrt && make -j1 prereq

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Build
        run: cd openwrt && make -j$(nproc) download && make -j$(nproc) IGNORE_ERRORS=m

      - name: Verify only a RAM image was produced
        run: |
          cd openwrt/bin/targets/sanechips/generic
          ls -la
          if ls *sysupgrade* >/dev/null 2>&1; then
            echo "error: a flashable sysupgrade image appeared; this stage must not produce one" >&2
            exit 1
          fi
          test -f openwrt-sanechips-generic-zte_zxhn-e2631-initramfs.uImage
          sha256sum openwrt-sanechips-generic-zte_zxhn-e2631-initramfs.uImage

      - name: Collect
        run: |
          mkdir -p out
          cp openwrt/bin/targets/sanechips/generic/*e2631*.uImage out/
          (cd openwrt/bin/targets/sanechips/generic && sha256sum *.uImage *.manifest 2>/dev/null) > out/sha256sums.txt
          cp openwrt/.config out/build.config
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: e2631-initramfs
          path: out
          if-no-files-found: error

      - name: Publish on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
